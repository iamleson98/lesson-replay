version: 2
# The npm ecosystem is not configured: the dependencies are exact versions in package.json with a bun.lock,
# which Dependabot's npm updater cannot resolve (the run fails). They move with `bun update` and the full
# checks behind it, like the other frontends of this project.
updates:
  # The actions in .github/workflows are pinned to a commit; this moves the pins (the version
  # stays in the comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The sui submodule (vendor/sui).
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
